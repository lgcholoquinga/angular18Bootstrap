<div class="table-responsive table-container">
	<table class="table table-striped table-hover">
		<thead>
			<tr class="table-info">
				@for (column of columns(); track column) {
					<th scope="col">{{ column }}</th>
				}
			</tr>
		</thead>

		<tbody>
			@for (item of data(); track $index) {
				<th scope="col">{{ item }}</th>
			}
		</tbody>
	</table>
</div>
